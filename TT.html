<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mua hàng - Thời Trang Cây Chuỗi</title>
    <link rel="stylesheet" href="TT.css">
</head>
<body>

   
    <header>
        <h1>THỜI TRANG CÂY CHUỖI</h1>
        <nav>
            <a href="../than/than.html">Giới thiệu</a>
            <a href="../than/than.html">Sản phẩm</a>
            <a href="TT.html">Mua hàng</a>
        </nav>
    </header>

    <!-- ========== MAIN ========== -->
    <main>

        <!-- Khối sản phẩm đã chọn (JS sẽ đổ vào) -->
        <section id="selected-product"></section>

        <!-- Khối form đặt hàng (ẩn mặc định) -->
        <section id="order-section" hidden>
            <h2>Thông tin khách hàng &amp; Thanh toán</h2>

            <form id="order-form">

                <!-- Chọn màu -->
                <label for="color">Màu sắc:</label>
                <select id="color" name="color">
                    <option value="">-- Chọn màu --</option>
                </select>

                <!-- Chọn size -->
                <label for="size">Kích thước:</label>
                <select id="size" name="size">
                    <option value="">-- Chọn size --</option>
                </select>

                <!-- Số lượng -->
                <label for="quantity">Số lượng:</label>
                <input type="number" id="quantity" name="quantity" min="1" value="1">

                <hr class="ngan-cach">

                <!-- Thông tin khách hàng -->
                <label for="fullname">Họ và tên:</label>
                <input type="text" id="fullname" name="fullname"
                       placeholder="Nhập họ và tên" required>

                <label for="phone">Số điện thoại:</label>
                <input type="tel" id="phone" name="phone"
                       placeholder="Nhập số điện thoại" required>

                <label for="address">Địa chỉ nhận hàng:</label>
                <input type="text" id="address" name="address"
                       placeholder="Nhập địa chỉ" required>

                <label for="note">Ghi chú:</label>
                <textarea id="note" name="note" rows="4"
                          placeholder="Ghi chú cho người bán"></textarea>

                <!-- Thanh toán -->
                <label for="payment">Phương thức thanh toán:</label>
                <select id="payment" name="payment">
                    <option value="cod">Thanh toán khi nhận hàng</option>
                    <option value="bank">Chuyển khoản</option>
                </select>

                <button type="submit">XÁC NHẬN ĐẶT HÀNG</button>

            </form>
        </section>

    </main>

    <!-- ========== FOOTER ========== -->
    <footer>
        <p>© 2026 Thời Trang Cây Chuỗi</p>
    </footer>

    <script src="TT.js"></script>

</body>
</html>
