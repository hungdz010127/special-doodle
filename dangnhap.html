
<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Đăng nhập</title>

    <link rel="stylesheet" href="dangnhap.css">
</head>

<body>

    <div class="login-container">

        <!-- Logo -->
         
      

        <!-- Khung đăng nhập -->
        <div class="login-box">
 <div class="logo">
    <img src="logo.jpg" alt="Logo" class="logo-image">
    <h1>Đăng nhập</h1>
</div>
            

            <form id="loginForm">

                <!-- Tên đăng nhập -->
                <div class="input-box">

                    <label for="username">
                        Tên đăng nhập
                    </label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Nhập tên đăng nhập"
                    >

                </div>


                <!-- Mật khẩu -->
                <div class="input-box">

                    <label for="password">
                        Mật khẩu
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Nhập mật khẩu"
                    >

                </div>


                <!-- Nút đăng nhập -->
                <button
                    type="submit"
                    class="login-button"
                >
                    Đăng nhập
                </button>


                <!-- Thông báo -->
                <p id="message"></p>


                <!-- Đăng nhập mạng xã hội -->
                <div class="social-login">

                    <div class="or">
                        <span>Hoặc đăng nhập bằng</span>
                    </div>


                    <!-- Google -->
                    <button
                        type="button"
                        class="social-button google-button"
                        id="googleLogin"
                    >

                        <span class="google-icon">G</span>

                        <span>
                            Đăng nhập bằng Google
                        </span>

                    </button>


                    <!-- Facebook -->
                    <button
                        type="button"
                        class="social-button facebook-button"
                        id="facebookLogin"
                    >

                        <span class="facebook-icon">f</span>

                        <span>
                            Đăng nhập bằng Facebook
                        </span>

                    </button>

                </div>


                <!-- Đăng ký -->
                <p class="register-text">

                    Chưa có tài khoản?

                    <a href="register.html">
                        Đăng ký
                    </a>

                </p>

            </form>

        </div>

    </div>


    <!-- JavaScript -->
    <script src="dangnhap.js"></script>

</body>

</html>
